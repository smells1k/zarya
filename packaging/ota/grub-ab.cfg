# Zarya OS A/B boot configuration. grubenv lives on the EFI system partition.
set timeout=5
set default=0

insmod all_video
insmod part_gpt
insmod fat
insmod ext2
insmod font
search --no-floppy --label ZARYA_EFI --set=esp
set root=$esp
set prefix=($esp)/boot/grub
if [ -f $prefix/unicode.pf2 ]; then
    loadfont $prefix/unicode.pf2
fi
insmod gfxterm
terminal_output gfxterm

if [ -f $prefix/grubenv ]; then
    load_env
fi

if [ "${zarya_default}" != "A" -a "${zarya_default}" != "B" ]; then
    set zarya_default=A
fi

if [ "${zarya_trial}" = "A" -o "${zarya_trial}" = "B" ]; then
    if [ "${zarya_tries}" = "" ]; then
        set zarya_tries=3
    fi
    if [ "${zarya_tries}" = "3" ]; then
        set zarya_tries=2
        save_env zarya_tries
        set zarya_boot=$zarya_trial
    elif [ "${zarya_tries}" = "2" ]; then
        set zarya_tries=1
        save_env zarya_tries
        set zarya_boot=$zarya_trial
    elif [ "${zarya_tries}" = "1" ]; then
        set zarya_tries=0
        save_env zarya_tries
        set zarya_boot=$zarya_trial
    else
        set zarya_trial=
        set zarya_tries=0
        save_env zarya_trial zarya_tries
        set zarya_boot=$zarya_default
    fi
else
    set zarya_boot=$zarya_default
fi

menuentry 'Zarya OS (A/B automatic)' --id zarya-auto {
    if [ "$zarya_boot" = "B" ]; then
        search --no-floppy --label ZARYA_B --set=root
        linux ($root)/boot/zarya-vmlinuz root=LABEL=ZARYA_B ro zarya.slot=B quiet
        initrd ($root)/boot/zarya-initrd.img
    else
        search --no-floppy --label ZARYA_A --set=root
        linux ($root)/boot/zarya-vmlinuz root=LABEL=ZARYA_A ro zarya.slot=A quiet
        initrd ($root)/boot/zarya-initrd.img
    fi
}

menuentry 'Zarya OS slot A (manual)' --id zarya-slot-a {
    search --no-floppy --label ZARYA_A --set=root
    linux ($root)/boot/zarya-vmlinuz root=LABEL=ZARYA_A ro zarya.slot=A quiet
    initrd ($root)/boot/zarya-initrd.img
}

menuentry 'Zarya OS slot B (manual)' --id zarya-slot-b {
    search --no-floppy --label ZARYA_B --set=root
    linux ($root)/boot/zarya-vmlinuz root=LABEL=ZARYA_B ro zarya.slot=B quiet
    initrd ($root)/boot/zarya-initrd.img
}

menuentry 'Reboot' --id zarya-reboot { reboot }
menuentry 'Power off' --id zarya-poweroff { halt }
