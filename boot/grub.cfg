# Zarya OS - ASCII-only GRUB menu for BIOS and UEFI
set default=0
set timeout=5
set timeout_style=menu
set gfxmode=1024x768x32,1280x800x32,800x600x32,auto
set gfxpayload=keep
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

insmod all_video
insmod font
if [ -f $prefix/unicode.pf2 ]; then
    loadfont $prefix/unicode.pf2
fi
insmod gfxterm
terminal_output gfxterm

menuentry 'Zarya OS 1.0 - Live (recommended)' {
    set gfxpayload=1024x768x32,1280x800x32,auto
    linux /live/vmlinuz boot=live live-config.username=zarya quiet loglevel=3 nomodeset modprobe.blacklist=i915,amdgpu,radeon,nouveau,bochs,virtio_gpu,nvidia,nvidia_drm
    initrd /live/initrd.img
}

menuentry 'Compatibility mode (VESA)' {
    set gfxpayload=1024x768x32
    linux /live/vmlinuz boot=live live-config.username=zarya quiet loglevel=3 video=vesafb:mtrr:3,ywrap,1024x768-32@60 nomodeset
    initrd /live/initrd.img
}

menuentry 'Safe mode (text console)' {
    linux /live/vmlinuz boot=live live-config.username=zarya zarya.nogui quiet nomodeset
    initrd /live/initrd.img
}

menuentry 'Hardware diagnostics' {
    linux /live/vmlinuz boot=live live-config.username=zarya
    initrd /live/initrd.img
}

menuentry 'Reboot' { reboot }
menuentry 'Power off' { halt }
