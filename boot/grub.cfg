# Zarya OS live boot configuration for Ubuntu 26.04 LTS and KDE Plasma.
set default=0
set timeout=5
set timeout_style=menu
set gfxmode=1024x768x32,1280x800x32,800x600x32,auto
set gfxpayload=keep
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

insmod all_video
insmod font
if [ -f $prefix/unicode.pf2 ]; then
    loadfont $prefix/unicode.pf2
fi
insmod gfxterm
terminal_output gfxterm

menuentry 'Zarya OS @VERSION@ - KDE Plasma (recommended)' {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry 'KDE Plasma live (verbose startup)' {
    linux /live/vmlinuz boot=live loglevel=7
    initrd /live/initrd.img
}

menuentry 'Recovery console (no desktop)' {
    linux /live/vmlinuz boot=live systemd.unit=multi-user.target loglevel=7
    initrd /live/initrd.img
}

menuentry 'Hardware diagnostics' {
    linux /live/vmlinuz boot=live loglevel=7
    initrd /live/initrd.img
}

menuentry 'Reboot' { reboot }
menuentry 'Power off' { halt }
